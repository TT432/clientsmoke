plugins {
    id 'java-library'
    id 'maven-publish'
}

// Stonecutter 0.9 centralScript: 此脚本对每个 version node (:1.20.1, :1.21.1, :26.1.2) 各跑一次。
// 版本比较用 sc.current.parsed.matches（0.8+ API）。
def isLegacyForge = sc.current.parsed.matches '<1.20.6'
def isModern = sc.current.parsed.matches '>=26.1'

stonecutter {
    constants['legacy'] = isLegacyForge
    constants['modern'] = isModern

    // NeoForge 包名替换（类名/API 相同，仅包路径不同）
    // 源码统一用 Forge 包名，neoforge 版本自动替换
    replacements.string(!isLegacyForge) {
        // Config spec
        replace 'net.minecraftforge.common.ForgeConfigSpec', 'net.neoforged.neoforge.common.ModConfigSpec'
        replace 'ForgeConfigSpec', 'ModConfigSpec'
        // FML core
        replace 'net.minecraftforge.fml.ModList', 'net.neoforged.fml.ModList'
        replace 'net.minecraftforge.fml.loading.FMLPaths', 'net.neoforged.fml.loading.FMLPaths'
        // Scan data
        replace 'net.minecraftforge.forgespi.language.ModFileScanData', 'net.neoforged.neoforgespi.language.ModFileScanData'
        // Dist / OnlyIn
        replace 'net.minecraftforge.api.distmarker', 'net.neoforged.api.distmarker'
        // SubscribeEvent (eventbus)
        replace 'net.minecraftforge.eventbus.api', 'net.neoforged.bus.api'
        // RenderLevelStageEvent
        replace 'net.minecraftforge.client.event.RenderLevelStageEvent', 'net.neoforged.neoforge.client.event.RenderLevelStageEvent'
    }

    // 26.1+ Window.getOpenGLWindow() 重命名为 handle()
    replacements.string(isModern) {
        replace '.getWindow().getWindow()', '.getWindow().handle()'
    }
}

// Stonecutter centralScript 不自动替换 sourceSet（0.7-0.9 均如此）：compileJava 默认编译 src/main/java，
// 但加了 //? 注释后原始源码有裸露的 else 分支导致语法错误。
// 必须让 sourceSet 指向 stonecutterGenerate 的生成目录。
def stonecutterMainBase = layout.buildDirectory.dir('generated/stonecutter/main')
sourceSets.main.java.srcDirs = [stonecutterMainBase.map { it.dir('java') }]
sourceSets.main.resources.srcDirs = [stonecutterMainBase.map { it.dir('resources') }]
compileJava.dependsOn 'stonecutterGenerate'
processResources.dependsOn 'stonecutterGenerate'
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'stonecutterGenerate' }
tasks.matching { it.name == 'createMinecraftArtifacts' }.configureEach { dependsOn 'stonecutterGenerate' }

// Stonecutter file handler 处理 clientsmoke.mixins.json 的 //? 版本条件（仅 legacy 编译 mixin）。
def cleanGeneratedJson = tasks.register('cleanGeneratedJson') {
    dependsOn 'stonecutterGenerate'
    doLast {
        def file = stonecutterMainBase.get().dir('resources').file('clientsmoke.mixins.json').asFile
        if (!file.exists()) return
        def text = file.text
        text = text.replaceAll(/(?s)\/\*.*?\*\//, '')
        text = text.replaceAll(/\/\/[^\r\n]*/, '')
        text = text.replaceAll(/,(\s*[\]\}])/, '$1')
        file.text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parseText(text))
        )
    }
}
processResources.dependsOn cleanGeneratedJson

if (isLegacyForge) {
    apply plugin: 'net.neoforged.moddev.legacyforge'
} else {
    apply plugin: 'net.neoforged.moddev'
}

version = "${mod_version}+${minecraft_version}-${isLegacyForge ? 'forge' : 'neoforge'}"
group = mod_group_id

base {
    archivesName = 'clientsmoke'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(property('java_version') as int)

if (isLegacyForge) {
    legacyForge {
        version = project.minecraft_version + '-' + project.forge_version

        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }

        mods {
            clientsmoke {
                sourceSet(sourceSets.main)
            }
        }

        runs {
            client {
                client()
                systemProperty 'forge.enabledGameTestNamespaces', 'clientsmoke'
            }

            clientSmoke {
                client()
                gameDirectory = project.file('run/clientsmoke')
                systemProperty 'forge.enabledGameTestNamespaces', 'clientsmoke'
                systemProperty 'clientsmoke.enabled', 'true'
                systemProperty 'clientsmoke.autoExit', 'true'
            }
        }
    }
} else {
    neoForge {
        version = project.neoforge_version

        mods {
            clientsmoke {
                sourceSet(sourceSets.main)
            }
        }

        runs {
            client {
                client()
                systemProperty 'neoforge.enabledGameTestNamespaces', 'clientsmoke'
            }

            clientSmoke {
                client()
                gameDirectory = project.file('run/clientsmoke')
                systemProperty 'neoforge.enabledGameTestNamespaces', 'clientsmoke'
                systemProperty 'clientsmoke.enabled', 'true'
                systemProperty 'clientsmoke.autoExit', 'true'
            }
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

if (isLegacyForge) {
    mixin {
        add sourceSets.main, 'clientsmoke.refmap.json'
        config 'clientsmoke.mixins.json'
    }

    dependencies {
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }
}

dependencies {
    compileOnly 'org.jspecify:jspecify:1.0.0'
}

jar {
    if (isLegacyForge) {
        manifest.attributes([
                'MixinConfigs': 'clientsmoke.mixins.json'
        ])
    }
}

// 非 legacy 版本排除 forge 专用的 mods.toml 和 mixins.json
processResources {
    if (isLegacyForge) {
        exclude 'META-INF/neoforge.mods.toml'
    } else {
        exclude 'META-INF/mods.toml'
        exclude 'clientsmoke.mixins.json'
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : findProperty('forge_version_range') ?: '',
            loader_version_range   : loader_version_range,
            neoforge_version_range : findProperty('neoforge_version_range') ?: '',
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

java {
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'clientsmoke'
        }
    }
    repositories {
        mavenLocal()
    }
}

// ModDevGradle 的 reobfJar 会把 jar 产物替换为 SRG 名称（intermediate）。
// 主项目 dev 环境需要 Mojang 映射，所以 publishToMavenLocal 后需要覆盖为 dev JAR。
def _archivesName = base.archivesName.get()
def _version = version
def _groupId = mod_group_id
def _buildDir = layout.buildDirectory.get().asFile
tasks.named('publishToMavenLocal') {
    doLast {
        def devJar = new File(_buildDir, "devlibs/${_archivesName}-${_version}.jar")
        def repoDir = new File(System.getProperty('user.home'), ".m2/repository/${_groupId.replace('.', '/')}/clientsmoke/${_version}")
        def target = new File(repoDir, "clientsmoke-${_version}.jar")
        if (devJar.exists() && target.exists()) {
            java.nio.file.Files.copy(devJar.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle('Replaced reobf JAR with dev JAR (Mojang mappings) at {}', target)
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test').configure {
    useJUnitPlatform()
}
