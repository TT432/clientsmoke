modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
# 纯客户端 smoke 测试框架：dedicated server 上跳过加载（同 mods.toml 的 clientSideOnly）。
clientSideOnly=true

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
mandatory=true
versionRange="${neoforge_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"
